# Aeglyn Security Scan GitHub Action
# Add this file to your repository at .github/workflows/vulscany.yml
# 
# This action will automatically scan your web application code for security
# vulnerabilities on every push and pull request.

name: 🛡️ Aeglyn Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
    types: [opened, synchronize, reopened]

# Prevent concurrent scans on the same branch/PR
concurrency:
  group: vulscany-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔍 Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.js
            **/*.jsx
            **/*.ts
            **/*.tsx
            **/*.vue
            **/*.svelte
            **/*.html
            **/*.php
            **/*.py
      
      - name: 🛡️ Run Aeglyn Scan
        id: scan
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Scanning changed files..."
          
          # Collect all changed files
          FILES="${{ steps.changed-files.outputs.all_changed_files }}"
          
          # Initialize results
          CRITICAL=0
          HIGH=0
          MEDIUM=0
          LOW=0
          FINDINGS=""
          
          for file in $FILES; do
            if [[ -f "$file" ]]; then
              echo "Scanning: $file"
              content=$(cat "$file" | head -c 100000)
              
              # 1. Unsafe HTML Rendering (React/Vue/Svelte/Angular)
              if echo "$content" | grep -qE "dangerouslySetInnerHTML|v-html|\[innerHTML\]|@html" && ! echo "$content" | grep -q "DOMPurify\|sanitize\|escape"; then
                ((HIGH++))
                FINDINGS="$FINDINGS\n- **HIGH** ⚠️ \`$file\`: Unsanitized HTML rendering detected"
              fi
              
              # 2. Dangerous Code Execution (Eval/Function)
              if echo "$content" | grep -qE "\beval\s*\(|\bnew\s+Function\s*\(" && ! echo "$file" | grep -q "\.test\.\|\.spec\.\|config"; then
                ((CRITICAL++))
                FINDINGS="$FINDINGS\n- **CRITICAL** 🔴 \`$file\`: Dangerous dynamic execution (eval/Function)"
              fi
              
              # 3. Obfuscation (atob-based)
              if echo "$content" | grep -qE "atob\s*\(\s*['\"\`][A-Za-z0-9+/=]{20,}"; then
                ((MEDIUM++))
                FINDINGS="$FINDINGS\n- **MEDIUM** 🟡 \`$file\`: Suspicious obfuscated content"
              fi
              
              # 4. Potential Secret Exposure
              if echo "$content" | grep -iqE "(API_KEY|SECRET|PASSWORD|TOKEN|AWS_ACCESS_KEY)\s*[:=]\s*['\"\`][A-Za-z0-9_\-]{16,}"; then
                ((CRITICAL++))
                FINDINGS="$FINDINGS\n- **CRITICAL** 🔴 \`$file\`: Potential hardcoded secret exposure"
              fi
            fi
          done
          
          # Calculate score
          SCORE=$((100 - (CRITICAL * 30) - (HIGH * 15) - (MEDIUM * 8)))
          if [ $SCORE -lt 0 ]; then SCORE=0; fi
          
          # Set outputs
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "medium=$MEDIUM" >> $GITHUB_OUTPUT
          echo "findings<<EOF" >> $GITHUB_OUTPUT
          echo -e "$FINDINGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # Determine status
          if [ $CRITICAL -gt 0 ]; then
            echo "status=critical" >> $GITHUB_OUTPUT
          elif [ $HIGH -gt 0 ]; then
            echo "status=warning" >> $GITHUB_OUTPUT
          elif [ $MEDIUM -gt 0 ]; then
            echo "status=notice" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
          fi
      
      - name: 💬 Comment on PR
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const score = '${{ steps.scan.outputs.score }}';
            const critical = '${{ steps.scan.outputs.critical }}';
            const high = '${{ steps.scan.outputs.high }}';
            const medium = '${{ steps.scan.outputs.medium }}';
            const findings = `${{ steps.scan.outputs.findings }}`;
            const status = '${{ steps.scan.outputs.status }}';
            
            let emoji = '✅';
            if (status === 'critical') emoji = '🔴';
            else if (status === 'warning') emoji = '⚠️';
            else if (status === 'notice') emoji = '🟡';
            
            const body = `## ${emoji} Aeglyn Security Scan
            
            ### Security Score: ${score}/100
            
            | Severity | Count |
            |----------|-------|
            | 🔴 Critical | ${critical} |
            | ⚠️ High | ${high} |
            | 🟡 Medium | ${medium} |
            
            ${findings ? `### Findings\n${findings}` : '### ✅ No security issues detected in changed files!'}
            
            ---
            
            <details>
            <summary>ℹ️ About Aeglyn</summary>
            
            [Aeglyn](https://app.example.com) is a privacy-first web security scanner.
            
            **Quick Fixes:**
            - For XSS: Use \`DOMPurify.sanitize()\`
            - For secrets: Move to environment variables (\`.env\`)
            - For eval: Use \`JSON.parse()\` or logic refactoring
            
            </details>
            
            *Powered by [Aeglyn](https://app.example.com) 🛡️*`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const botComment = comments.find(c => 
              c.user.type === 'Bot' && c.body.includes('Aeglyn Security Scan')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
      
      - name: 📊 Summary Report
        if: always() && steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "### Aeglyn Security Summary" >> $GITHUB_STEP_SUMMARY
          echo "Score: ${{ steps.scan.outputs.score }}/100" >> $GITHUB_STEP_SUMMARY
          echo "Critical: ${{ steps.scan.outputs.critical }}" >> $GITHUB_STEP_SUMMARY
          echo "High: ${{ steps.scan.outputs.high }}" >> $GITHUB_STEP_SUMMARY
          echo "Medium: ${{ steps.scan.outputs.medium }}" >> $GITHUB_STEP_SUMMARY
