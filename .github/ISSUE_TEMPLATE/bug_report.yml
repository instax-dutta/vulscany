name: Bug report
description: Something behaves incorrectly
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use GitHub Security Advisories instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npm run scan:cli -- --in ... --out ...`
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Minimal code or config that triggers it
      description: Redact tokens and secrets. A short snippet is far more useful than a full repository.
  - type: input
    id: version
    attributes:
      label: vulscany version or commit
      placeholder: git rev-parse HEAD
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scanner detection
        - Revalidation
        - AI fix generation
        - Threat intelligence
        - Reports and CLI
        - Authentication
        - Documentation
        - Something else
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v20.11.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Remove tokens before pasting.
      render: shell
